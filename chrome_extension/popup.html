<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Atlas DownloadTube</title>
  <style>
    body {
      width: 330px;
      margin: 0;
      padding: 14px;
      background: #181c24;
      color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #2d3748;
      padding-bottom: 10px;
    }
    .header img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      object-fit: cover;
    }
    .header h1 {
      font-size: 14px;
      margin: 0;
      color: #00d26a;
      font-weight: 700;
    }
    .status-badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 10px;
      margin-right: auto;
      font-weight: bold;
    }
    .online { color: #00d26a; background: rgba(0, 210, 106, 0.15); }
    .offline { color: #ff4757; background: rgba(255, 71, 87, 0.15); }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #007bff, #00d26a);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .url-display {
      background: #232936;
      border: 1px solid #323b4c;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      color: #a0aec0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 10px;
    }
    .results {
      max-height: 260px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .opt-item {
      background: #232936;
      border: 1px solid #323b4c;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .opt-item:hover {
      background: #007bff;
      color: #fff;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon48.png" alt="Atlas Logo" />
    <h1>Atlas DownloadTube</h1>
    <span id="app-status" class="status-badge online">متصل ✓</span>
  </div>

  <div id="url-box" class="url-display">جاري قراءة الصفحة الحالية...</div>

  <button id="analyze-tab-btn" class="btn">🔍 فحص واستخراج وسائط الصفحة</button>

  <div id="results-container" class="results" style="display: none;"></div>

  <script src="popup.js"></script>
</body>
</html>
